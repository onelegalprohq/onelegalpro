; PF-010 Docker Development Environment
; Development-only PHP settings. Not used in production (no production
; deployment exists yet — see docs/PROJECT_STATUS.md).

upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 512M
max_execution_time = 120
max_input_time = 120

display_errors = On
display_startup_errors = On
error_reporting = E_ALL

opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
