# PF-010 Docker Development Environment
# Development-only Nginx configuration. Serves public/ only and proxies PHP
# requests to the app (PHP-FPM) service. Not a production configuration.

server {
    listen 80;
    server_name localhost;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 64M;

    access_log /dev/stdout;
    error_log /dev/stderr;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Deny access to anything outside public/ (dotfiles, storage, vendor, etc.)
    location ~ /\.(?!well-known) {
        deny all;
    }
}
