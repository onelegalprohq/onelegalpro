# PF-010 Docker Development Environment
#
# Reproducible local development environment for the OneLegalPro Laravel
# application. This is development infrastructure only: it does not deploy
# OneLegalPro to production, configure a public domain/DNS/SSL, or implement
# PF-011 (Local Environment & Configuration) or PF-012 (Development Tooling).
#
# All published ports bind to 127.0.0.1 only. PostgreSQL and Redis publish no
# ports at all and are reachable only from other services on the internal
# "onelegalpro" network.
#
# See README.md for build/start/inspect/test/stop commands.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: onelegalpro/app:dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: local
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: onelegalpro
      DB_USERNAME: onelegalpro_app
      DB_PASSWORD: onelegalpro_app_dev_only
      DB_MIGRATION_USERNAME: onelegalpro_migration
      DB_MIGRATION_PASSWORD: onelegalpro_migration_dev_only
      DB_OUTBOX_USERNAME: onelegalpro_outbox
      DB_OUTBOX_PASSWORD: onelegalpro_outbox_dev_only
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
    networks:
      - onelegalpro

  web:
    image: nginx:1.27-alpine
    depends_on:
      - app
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - onelegalpro

  postgres:
    image: postgres:16-alpine
    environment:
      # Local-development-only defaults. Never used outside this Docker
      # environment and never valid credentials for any real environment.
      POSTGRES_DB: onelegalpro
      POSTGRES_USER: onelegalpro_bootstrap
      POSTGRES_PASSWORD: onelegalpro_bootstrap_dev_only
      PF074_MIGRATION_ROLE: onelegalpro_migration
      PF074_MIGRATION_PASSWORD: onelegalpro_migration_dev_only
      PF074_RUNTIME_ROLE: onelegalpro_app
      PF074_RUNTIME_PASSWORD: onelegalpro_app_dev_only
      PF074_OUTBOX_ROLE: onelegalpro_outbox
      PF074_OUTBOX_PASSWORD: onelegalpro_outbox_dev_only
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/provision-roles.sh:/docker-entrypoint-initdb.d/10-provision-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onelegalpro_app -d onelegalpro"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - onelegalpro

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - onelegalpro

  vite:
    image: node:22-alpine
    working_dir: /var/www/html
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      APP_URL: http://localhost:8080
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - .:/var/www/html
      - node_modules_data:/var/www/html/node_modules
    networks:
      - onelegalpro

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    image: onelegalpro/app:dev
    user: www-data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: php artisan queue:work --tries=1 --timeout=90
    environment:
      APP_ENV: local
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: onelegalpro
      DB_USERNAME: onelegalpro_app
      DB_PASSWORD: onelegalpro_app_dev_only
      DB_MIGRATION_USERNAME: onelegalpro_migration
      DB_MIGRATION_PASSWORD: onelegalpro_migration_dev_only
      DB_OUTBOX_USERNAME: onelegalpro_outbox
      DB_OUTBOX_PASSWORD: onelegalpro_outbox_dev_only
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
    networks:
      - onelegalpro

networks:
  onelegalpro:
    driver: bridge

volumes:
  postgres_data:
  vendor_data:
  node_modules_data:
