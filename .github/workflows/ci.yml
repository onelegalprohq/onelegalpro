# PF-030 GitHub Actions
#
# Runs the repository's already-configured checks (PF-020 Laravel Pint,
# PF-021 Larastan/PHPStan, the PHPUnit suite, and the Vite production build)
# automatically on pull requests targeting main.
#
# PF-031 (Quality Gates) made all three of these checks REQUIRED through the
# active "Protect main" GitHub ruleset, so a pull request targeting main cannot
# merge until every one of them passes. That enforcement lives in GitHub's
# repository settings, not in this file. Required checks are matched by exact
# check name, so renaming the "PHP Code Quality", "Frontend Build", or
# "Application Tests" job below without a corresponding human-reviewed ruleset
# update makes the repository fail closed: GitHub keeps waiting for a required
# check name that no longer reports. Security scanning remains PF-032 scope and
# is not implemented here.
#
# PF-033 (PostgreSQL Continuous Integration) moved the "Application Tests" job
# off phpunit.xml's SQLite ":memory:" fallback and onto an ephemeral
# PostgreSQL 16 service, with a job-local non-superuser NOBYPASSRLS role owning
# a fresh disposable database. Laravel migrations and the complete suite run
# against that database, and a fail-closed engine guard
# (tests/Feature/PostgreSqlTestDatabaseGuardTest.php) rejects a wrong driver,
# an unreachable server, a non-16 server, a superuser, or a BYPASSRLS role.
# The job name is unchanged, so the "Protect main" ruleset is unaffected.
# PF-033 added no Redis service, queue worker, dependency, or deployment step,
# and no production credential, endpoint, or database.
#
# This workflow calls the existing Composer/npm scripts directly. It never
# invokes the PF-023 Git hooks, which remain optional, bypassable, local-only
# developer feedback.
#
# Every third-party and official action is pinned to a full commit SHA. The
# PostgreSQL service image is pinned to the contract-authorized
# "postgres:16-alpine" tag, and the engine guard independently asserts the
# major version at runtime.

name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Read-only. No job writes to the repository, comments on a pull request,
# publishes anything, or uses a repository secret.
permissions:
  contents: read

# A newer commit on the same pull request cancels its superseded run, while
# separate pull requests never cancel one another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: PHP Code Quality
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: ctype, dom, fileinfo, filter, hash, iconv, json, libxml, mbstring, openssl, pdo, pdo_sqlite, session, sqlite3, tokenizer, xml, xmlwriter
          coverage: none
          tools: composer:v2

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # Check-only. Never runs the fixing "composer pint" script.
      - name: Check code style (Laravel Pint)
        run: composer pint:test

      - name: Run static analysis (Larastan/PHPStan)
        run: composer phpstan

  frontend:
    name: Frontend Build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install npm dependencies from lock file
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Verify build manifest exists
        run: test -f public/build/manifest.json

      # Build input for the "tests" job only. Not a deployment artifact and
      # never published outside this workflow run.
      - name: Upload build output for the tests job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-build
          path: public/build
          if-no-files-found: error
          retention-days: 1

  tests:
    name: Application Tests
    runs-on: ubuntu-24.04
    env:
      REQUIRE_POSTGRESQL_TEST_DATABASE: 'true'
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: onelegalpro_test
      DB_USERNAME: onelegalpro_test_app
      DB_PASSWORD: onelegalpro_test_app_test_only
      DB_MIGRATION_USERNAME: onelegalpro_test_migration
      DB_MIGRATION_PASSWORD: onelegalpro_test_migration_test_only
      DB_OUTBOX_USERNAME: onelegalpro_test_outbox
      DB_OUTBOX_PASSWORD: onelegalpro_test_outbox_test_only
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: onelegalpro_bootstrap
          POSTGRES_PASSWORD: onelegalpro_bootstrap_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U onelegalpro_bootstrap -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # The Feature test renders a view containing @vite(...). A fresh runner has
    # no Vite dev server and therefore no "public/hot" file, so Laravel resolves
    # assets through public/build/manifest.json instead. That manifest must exist
    # before the suite runs, which is why this job consumes the frontend build.
    needs: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: ctype, dom, fileinfo, filter, hash, iconv, json, libxml, mbstring, openssl, pdo, pdo_pgsql, session, tokenizer, xml, xmlwriter
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # .env.example is the tracked, non-secret local-development example
      # standardized by PF-011. No secret is used or required.
      - name: Create environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate --ansi

      - name: Download frontend build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-build
          path: public/build

      - name: Verify build manifest is present
        run: test -f public/build/manifest.json

      # Bootstrap credentials are fixed, non-secret, and confined to this
      # disposable service. Laravel never receives them: the suite and
      # migrations use the separate non-superuser database owner below.
      - name: Provision separated PostgreSQL test roles and database
        env:
          PGPASSWORD: onelegalpro_bootstrap_only
          POSTGRES_USER: onelegalpro_bootstrap
          POSTGRES_DB: onelegalpro_test
          PF074_MIGRATION_ROLE: onelegalpro_test_migration
          PF074_MIGRATION_PASSWORD: onelegalpro_test_migration_test_only
          PF074_RUNTIME_ROLE: onelegalpro_test_app
          PF074_RUNTIME_PASSWORD: onelegalpro_test_app_test_only
          PF074_OUTBOX_ROLE: onelegalpro_test_outbox
          PF074_OUTBOX_PASSWORD: onelegalpro_test_outbox_test_only
          PGHOST: 127.0.0.1
          PGPORT: '5432'
        run: |
          psql --version
          sh docker/postgres/provision-roles.sh bootstrap

      # Fails the job outright — never skips — when the guard flag is missing,
      # renamed, or not exactly "true". Without this, deleting or renaming the
      # job-level env block above would silently disarm the guard AND drop
      # Laravel back to phpunit.xml's SQLite fallback, leaving a green
      # "Application Tests" check that never touched PostgreSQL. This step reads
      # the variable defensively (":-") so an absent env block reaches the
      # failure branch instead of erroring on an unbound variable.
      - name: Assert the PostgreSQL engine guard is armed
        run: |
          if [ "${REQUIRE_POSTGRESQL_TEST_DATABASE:-}" != "true" ]; then
            echo "::error::REQUIRE_POSTGRESQL_TEST_DATABASE must be exactly 'true' for the Application Tests job. Got: '${REQUIRE_POSTGRESQL_TEST_DATABASE:-<unset>}'. The PF-033 PostgreSQL engine guard (tests/Feature/PostgreSqlTestDatabaseGuardTest.php) is inert without it, and the suite would silently fall back to SQLite. Restore the job-level env block in .github/workflows/ci.yml."
            exit 1
          fi
          echo "PostgreSQL engine guard armed."

      - name: Run migrations with the migration role
        run: php artisan migrate --force --no-interaction --database=pgsql_migration

      - name: Grant the runtime role access to framework relations
        env:
          PGPASSWORD: onelegalpro_bootstrap_only
          POSTGRES_USER: onelegalpro_bootstrap
          POSTGRES_DB: onelegalpro_test
          PF074_MIGRATION_ROLE: onelegalpro_test_migration
          PF074_MIGRATION_PASSWORD: onelegalpro_test_migration_test_only
          PF074_RUNTIME_ROLE: onelegalpro_test_app
          PF074_RUNTIME_PASSWORD: onelegalpro_test_app_test_only
          PF074_OUTBOX_ROLE: onelegalpro_test_outbox
          PF074_OUTBOX_PASSWORD: onelegalpro_test_outbox_test_only
          PGHOST: 127.0.0.1
          PGPORT: '5432'
        run: sh docker/postgres/provision-roles.sh grants

      # The explicit guard flag makes a missing service, wrong driver, wrong
      # major version, superuser, or BYPASSRLS role a hard test failure.
      - name: Run test suite
        run: composer test
